[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip_benchmark"
version = "1.6.2"
description = "CLIP-like models benchmarks on various datasets"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mehdi Cherti", email = "mehdicherti@gmail.com" },
    { name = "Romain Beaumont", email = "romain.rom1@gmail.com" },
]
keywords = ["clip_benchmark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=1.8.1",
    "torchvision>=0.8.9",
    "tqdm>=2",
    "scikit-learn>=1.0,<2",
    "open_clip_torch>=0.2.1",
    "pycocoevalcap",
    "webdataset>=0.2.31",
    "transformers",
]

[project.optional-dependencies]
vtab = ["task_adaptation==0.1", "timm>=0.5.4"]
tfds = ["tfds-nightly", "timm>=0.5.4"]
coco = ["pycocotools>=2.0.4"]
audio = [
    "open_clip_torch[audio]>=4.2.1",
    "datasets>=5.0.1,<6",
    "mteb[audio]==2.21.0",
    "scikit-learn==1.9.1",
    "mseb @ git+https://github.com/google-research/mseb.git@42595cf4fb55a96adfc77ace544fb19d27490a3b",
]
# the dependencies of heareval, which pins outdated ones itself: install it with --no-deps, see README.
# Lightning 1.6-1.8 keeps heareval's best-epoch selection, dcase_util needs pkg_resources (setuptools<82),
# and newer pynvml returns str where heareval expects bytes
hear = [
    "tensorflow",
    "intervaltree",
    "pytorch-lightning>=1.6,<1.9",
    "setuptools<82",
    "pynvml<11.5",
    "dcase_util",
    "sed_eval",
    "python-slugify",
    "torchinfo",
    "more-itertools",
    "click",
]
test = ["pytest"]

[project.scripts]
clip_benchmark = "clip_benchmark.cli:main"
clip_benchmark_export_wds = "clip_benchmark.webdataset_builder:main"

[project.urls]
Homepage = "https://github.com/LAION-AI/CLIP_benchmark"

[tool.setuptools.packages.find]
include = ["clip_benchmark", "clip_benchmark.*"]

[tool.setuptools.package-data]
"clip_benchmark.datasets" = ["*.json", "*.txt"]
